spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/order-hub}
    username: ${SPRING_DATASOURCE_USERNAME:e-mall}
    password: ${SPRING_DATASOURCE_PASSWORD:root}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVICE_PORT:8081}

app:
  jwt:
    secret: ${JWT_SECRET}

services:
  catalog:
    host: ${CATALOG_IP_ADDRESS:http://localhost}
    port: ${CATALOG_PORT:8081}
  campaigns:
    host: ${CAMPAIGNS_IP_ADDRESS:http://localhost}
    port: ${CAMPAIGNS_PORT:8082}
  accounts:
    host: ${ACCOUNTS_IP_ADDRESS:http://localhost}
    port: ${ACCOUNTS_PORT:8083}
  media-manager:
    host: ${MEDIA_MANAGER_IP_ADDRESS:http://localhost}
    port: ${MEDIA_MANAGER_PORT:8085}
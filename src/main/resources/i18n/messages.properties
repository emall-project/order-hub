# Common validation messages

jakarta.validation.constraints.NotBlank.message = must not be blank
jakarta.validation.constraints.NotNull.message = must not be null
jakarta.validation.constraints.Positive.message = must be positive
jakarta.validation.constraints.Size.message = size must be between {min} and {max}
jakarta.validation.constraints.Min.message = must be at least {value}
jakarta.validation.constraints.Max.message = must be at most {value}
jakarta.validation.constraints.DecimalMin.message = must be at least {value}
jakarta.validation.constraints.Future.message = must be a future date
jakarta.validation.constraints.FutureOrPresent.message = must be a date in the present or future
jakarta.validation.constraints.Email.message = must be a valid email address
jakarta.validation.constraints.Pattern.message = must match the required pattern

# Cart validation messages
cart.mallId.notnull = Mall ID must not be null
cart.mallId.positive = Mall ID must be positive
cart.productId.notnull = Product ID must not be null
cart.productId.positive = Product ID must be positive
cart.variantId.notnull = Variant ID must not be null
cart.variantId.positive = Variant ID must be positive
cartItem.quantity.notnull = Quantity must not be null
cartItem.quantity.min = Quantity must be at least 1
cart.cityId.positive = City ID must be positive
cart.deliveryName.size = Delivery name must be between 2 and 100 characters
cart.deliveryPhone.size = Delivery phone must be between 7 and 20 characters
cart.deliveryNote.size = Delivery note cannot exceed 255 characters
cart.deliveryLocation.size = Delivery address must be between 5 and 255 characters

# Checkout request validation
checkout.cityId.notnull = City ID is required
checkout.cityId.positive = City ID must be positive
checkout.deliveryName.notblank = Delivery name is required
checkout.deliveryName.size = Delivery name must be between 2 and 100 characters
checkout.deliveryPhone.notblank = Delivery phone is required
checkout.deliveryPhone.size = Delivery phone must be between 7 and 20 characters
checkout.deliveryLocation.notblank = Delivery address is required
checkout.deliveryLocation.size = Delivery address must be between 5 and 255 characters
checkout.deliveryNote.size = Delivery note cannot exceed 255 characters

# Cart exceptions
cart.not.found = Cart not found
cart.already.active = Customer already has an active cart
cart.not.active = Cart is not active
cart.item.not.found = Cart item not found
cart.item.not.in.cart = Cart item does not belong to this cart
cart.item.duplicate.variant = This variant is already in the cart
cart.empty.checkout = Cannot checkout an empty cart
cart.already.checked.out = Cart has already been checked out
product.not.found.in.catalog = Product not found in catalog
product.not.active = Product is not active
cart.product.does.not.belong.to.mall = Product does not belong to the selected mall
variant.not.found.in.catalog = Variant not found in catalog
city.not.found = City not found
customer.not.found = Customer not found
customer.not.active = Customer account is not active

# ShopOrder validation messages
# (no custom validation messages in DTOs, only common ones)

# ShopOrder exceptions
shop.order.not.found = Order not found
shop.order.does.not.belong.to.shop = This order does not belong to your shop
shop.order.invalid.status.transition = Invalid status transition
order.item.not.found = Order item not found
shop.not.found = Shop not found
shop.not.active = Shop is not active

# Delivery validation messages
delivery.failureReason.notblank = Failure reason is required
delivery.failureReason.size = Failure reason must be between 3 and 500 characters

# Delivery exceptions
delivery.not.found = Delivery record not found
delivery.already.delivered = Delivery already marked as delivered
delivery.already.failed = Delivery already marked as failed
delivery.invalid.status.transition = Invalid delivery status transition
delivery.failure.reason.required = Failure reason is required when marking delivery as failed

# ReturnRequest validation messages
returnRequest.orderItemId.notnull = Order item ID must not be null
returnRequest.orderItemId.positive = Order item ID must be positive
returnRequest.reason.notblank = Return reason is required
returnRequest.reason.size = Return reason must be between 3 and 500 characters
returnRequest.description.size = Return description cannot exceed 2000 characters
returnRequest.imageUuid.notnull=An image is required when submitting a return request.

# ReturnRequest exceptions
return.request.not.found = Return request not found
return.request.already.exists = A return request already exists for this order item
return.request.item.not.in.holding = Return can only be requested for items in HOLDING status
return.request.already.processed = Return request has already been processed
return.rejection.reason.required = Rejection reason is required
return.does.not.belong.to.shop = This return request does not belong to your shop
returnRequest.image.not.found = Image not found
returnRequest.image.invalid.type = Invalid image file type
returnRequest.media.service.unavailable = Media service is unavailable

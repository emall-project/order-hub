spring:
  application:
    name: order-hub
  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      #      replace it with validate when adding liquibase configration
      ddl-auto: update
    properties:
      hibernate:
        default_schema: public
      org:
        hibernate:
          envers:
            revision_type_field_name: revtype
            revision_field_name: rev
            track_entities_changed_in_revision: false

  liquibase:
    enabled: false
  #    unhash it with validate when adding liquibase configration
  #    enabled: true
  #    change-log: classpath:db/changelog/db.changelog-master.xml

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false


  jackson:
    time-zone: Asia/Gaza

management:
  otlp:
    metrics:
      export:
        url: ${GRAFANA_URL:http://localhost:4318}/v1/metrics
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${GRAFANA_URL:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${GRAFANA_URL:http://localhost:4318}/v1/logs
  endpoints:
    web:
      exposure:
        include: health, info

services:
  catalog:
    host: ${CATALOG_IP_ADDRESS:http://localhost}
    port: ${CATALOG_PORT:8081}
  campaigns:
    host: ${CAMPAIGNS_IP_ADDRESS:http://localhost}
    port: ${CAMPAIGNS_PORT:8082}
  accounts:
    host: ${ACCOUNTS_IP_ADDRESS:http://localhost}
    port: ${ACCOUNTS_PORT:8083}
  media-manager:
    host: ${MEDIA_MANAGER_IP_ADDRESS:http://localhost}
    port: ${MEDIA_MANAGER_PORT:8085}